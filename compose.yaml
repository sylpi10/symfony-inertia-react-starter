# Development stack: `make docker-up`, then http://localhost:8000
services:
    php:
        build:
            context: .
            target: php_dev
        # Run as the host user, so that files written in the project (vendor/, var/) belong to you
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            SERVER_NAME: ":8000" # plain HTTP, no certificate
            DATABASE_URL: "sqlite:////srv/data/data_%kernel.environment%.db"
        ports:
            - "${APP_PORT:-8000}:8000"
        volumes:
            - .:/app
            - sqlite_data:/srv/data

    node:
        build:
            context: .
            target: node_dev
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        command: sh -c "npm ci && npm run dev"
        environment:
            # Listen on every interface of the container...
            VITE_HOST: 0.0.0.0
            # ...but tell the browser to load assets (and open the HMR socket) on the published port
            VITE_ORIGIN: "http://localhost:${VITE_PORT:-5173}"
        ports:
            - "${VITE_PORT:-5173}:5173"
        volumes:
            - .:/app
            - node_modules:/app/node_modules

volumes:
    sqlite_data:
    node_modules:
